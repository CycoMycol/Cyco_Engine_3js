<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cyco Engine</title>
  <link rel="stylesheet" href="./src/theme/cyco-theme.css" />
  <script type="importmap">
  {
    "imports": {
      "three":                  "./libs/three/build/three.module.min.js",
      "three/webgpu":           "./libs/three/build/three.webgpu.min.js",
      "three/tsl":              "./libs/three/build/three-tsl.js",
      "three/addons/":          "./libs/three/addons/",
      "postprocessing":         "./libs/postprocessing/index.js",
      "three-gpu-pathtracer":   "./libs/three-gpu-pathtracer/index.module.js",
      "three-mesh-bvh":         "./libs/three-mesh-bvh/index.module.js",
      "@dimforge/rapier3d-compat": "./libs/rapier3d/rapier.es.js",
      "@dimforge/rapier2d-compat": "./libs/rapier2d/rapier.es.js"
    }
  }
  </script>
</head>
<body>
  <div id="app"></div>

  <!-- UMD bundle — must load before any module script -->
  <script src="./libs/dockview-core.min.js"></script>
  <script>
    try {
      window.__cyco_internal_log = window.__cyco_internal_log || [];
      window.__cyco_log = function(tag, payload) {
        try { window.__cyco_internal_log.push({ tag, payload, ts: Date.now() }); } catch (e) {}
        try { console.log(tag, payload); } catch (e) {}
      };
      // Capture every console.log so we can read the [group-debug] trace
      // after the page has reloaded (in-memory window.__consoleLog is
      // wiped by reloads, but this array is exposed on window for our
      // debug tool to read).
      const _origLog = console.log;
      console.log = function(...args) {
        try {
          const joined = args.map(a => {
            if (typeof a === 'string') return a;
            if (a && a.stack) return a.stack;
            try { return JSON.stringify(a, (k,v)=>v&&typeof v==='object'&&v.isObject3D?'[O3D:'+v.name+']':v); }
            catch { return '[unserializable]'; }
          }).join(' ');
          window.__cyco_internal_log.push({ tag: 'console', payload: joined, ts: Date.now() });
        } catch (e) {}
        return _origLog.apply(console, args);
      };
    } catch (err) {}
  </script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
